const exerciseLibrary = {
  deadBug:{name:"Dead Bug",target:"Deep core (transverse abdominis), lower back stability",cues:["Lie on your back, arms pointing straight up, knees bent at 90 degrees.","Press your lower back firmly into the floor and keep it there throughout.","Slowly lower the opposite arm and leg toward the floor.","Return to start with control, then switch sides.","If your lower back arches off the floor, reduce the range."]},
  birdDog:{name:"Bird-Dog",target:"Spinal stabilisers (multifidus), glutes, balance",cues:["Start on hands and knees, hands under shoulders, knees under hips.","Extend the opposite arm and leg until both are level with your back.","Keep your hips square, do not let them rotate.","Hold for 2 seconds at the top, then return with control.","Imagine balancing a glass of water on your lower back."]},
  gluteBridge:{name:"Glute Bridge",target:"Glutes, hamstrings, posterior chain",cues:["Lie on your back, knees bent, feet flat and hip-width apart.","Drive through your heels and lift your hips toward the ceiling.","Squeeze your glutes hard at the top, hold for 2 seconds.","Form a straight line from knees to shoulders. Do not over-arch.","Lower slowly. For single-leg, extend one leg straight out."]},
  rdl:{name:"Single-Leg Romanian Deadlift",target:"Hamstrings, glutes, balance, posterior chain",cues:["Stand on one leg, slight bend in the knee.","Hinge at the hip, push your butt back as your torso lowers.","Let the free leg extend straight behind you for counterbalance.","Keep your back flat and hips square to the floor.","Drive through the heel to return to standing."]},
  clamshell:{name:"Side-Lying Clamshell",target:"Glute medius, key for running hip stability",cues:["Lie on your side, knees bent, stacked on top of each other.","Keep your feet together throughout the movement.","Lift the top knee up like a clam opening, keep hips still.","Do not let your top hip roll backward.","Add a resistance band above the knees to progress."]},
  mcgillCurl:{name:"McGill Curl-Up",target:"Deep abdominals, spine-safe core exercise",cues:["Lie on your back, one knee bent, one leg straight.","Place both hands under your lower back, palms down.","Lift your head and shoulders just slightly off the floor.","Do NOT flex your spine, the lift is tiny and rigid.","Hold briefly, lower with control. This protects the lower back."]},
  catCow:{name:"Cat-Cow",target:"Lumbar spine mobility, warm-up and cool-down",cues:["Start on hands and knees in a tabletop position.","Cow: drop your belly, lift your chest and tailbone (inhale).","Cat: round your spine toward the ceiling, tuck your chin (exhale).","Move slowly between the two with your breath.","Great after every long run to decompress the spine."]},
  bulgarianSplit:{name:"Bulgarian Split Squat",target:"Quads, glutes, single-leg strength",cues:["Stand lunge-length in front of a bench. Rest one foot behind on it.","Lower straight down, front thigh toward parallel.","Keep your front knee tracking over your toes.","Most of your weight stays on the front leg.","Drive through the front heel to stand. Go slow on the descent."]},
  nordicCurl:{name:"Nordic Hamstring Curl",target:"Hamstrings (eccentric), top injury-prevention exercise",cues:["Kneel down, anchor your feet under something solid or have a partner hold.","Keep a straight line from knees to head, no hip bend.","Lower your torso toward the floor as slowly as you can.","Catch yourself with your hands, then push back up.","Even 3-4 second lowers are valuable. Build up gradually."]},
  stepUp:{name:"Step-Up with Knee Drive",target:"Glutes, quads, running-specific power",cues:["Stand facing a bench or sturdy box.","Step up, driving through the heel of the leading foot.","At the top, drive the trailing knee up to 90 degrees.","Stand tall and balanced at the top for a beat.","Lower with control. Do not push off the back foot."]},
  copenhagen:{name:"Copenhagen Side Plank",target:"Adductors, core, hip stability",cues:["Lie on your side, top foot or shin resting on a bench.","Lift your hips so your body forms a straight line.","The bottom leg hovers below or tucks up.","Hold strong, do not let the hips sag.","Start with short holds (10-20s) and build up."]},
  calfRaise:{name:"Eccentric Calf Raise",target:"Calves, Achilles tendon resilience",cues:["Stand on the edge of a step, heels hanging off.","Rise up onto your toes using both feet.","Shift your weight onto ONE foot.","Lower that heel slowly below the step (3-4 seconds).","Reset with both feet and repeat. Builds Achilles durability."]},
  hipFlexorStretch:{name:"Hip Flexor Stretch (Deep Lunge)",target:"Hip flexors, tightness here causes lower back pain",cues:["Kneel in a lunge: one foot forward, other knee on the floor.","Tuck your pelvis under (posterior tilt), this is the key.","Gently push your hips forward until you feel a stretch.","Keep your torso upright. Do not arch your lower back.","Hold 45 seconds each side. Tight hip flexors tilt the pelvis."]},
  lateralBandWalk:{name:"Lateral Band Walk",target:"Glute medius, hip stability",cues:["Place a resistance band above your knees.","Drop into a quarter-squat, athletic stance.","Step sideways, keeping tension on the band the whole time.","Do not let your knees cave inward.","Take controlled steps. Keep your torso still."]},
  pullUp:{name:"Pull-Up / Lat Pulldown",target:"Lats, the engine of your swim pull",cues:["Grip the bar slightly wider than shoulder-width.","Pull your shoulder blades down and back first.","Drive your elbows down toward your ribs.","Pull until your chin clears the bar (or bar to chest).","Lower slowly. No-bar option: band-assisted pulldown."]},
  dbRow:{name:"Single-Arm Dumbbell Row",target:"Lats, mid-back, mimics the crawl catch-and-pull",cues:["One knee and hand on a bench, other foot on the floor.","Let the dumbbell hang, arm straight, back flat.","Pull the dumbbell to your hip, elbow close to your body.","Squeeze the shoulder blade at the top.","Lower with control. This trains your swim pull directly."]},
  bandPullApart:{name:"Band Pull-Apart",target:"Rear delts, external rotators, shoulder health",cues:["Hold a resistance band with both hands, arms straight ahead.","Keep your arms straight at shoulder height.","Pull the band apart, bringing it toward your chest.","Squeeze your shoulder blades together.","Return slowly. Protects shoulders against swim volume."]},
  facePull:{name:"Face Pull",target:"Rotator cuff, rear delts",cues:["Anchor a band at face height. Hold with both hands.","Pull the band toward your face, splitting your hands apart.","Aim your thumbs back past your ears.","Keep your elbows high throughout.","Crucial rotator-cuff work for swimmers."]},
  pushUp:{name:"Narrow-Grip Push-Up",target:"Triceps, chest, swim exit strength",cues:["Hands roughly shoulder-width, slightly narrower.","Keep your body in a straight rigid line, brace your core.","Lower until your chest is just above the floor.","Keep your elbows tucked at about 45 degrees, not flared wide.","Press back up powerfully."]},
  pigeon:{name:"Pigeon Pose",target:"Glutes, hip rotators, deep mobility",cues:["From all fours, bring one knee forward behind your wrist.","Extend the other leg straight back behind you.","Keep your hips square to the floor.","Fold your torso forward over the front shin.","Breathe and hold. Eases hip and glute tightness."]},
};
